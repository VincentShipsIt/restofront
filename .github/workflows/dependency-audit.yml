name: Dependency audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".npmrc"
      - "Dockerfile"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "scripts/audit-dependencies.ts"
      - "src/lib/dependency-audit.test.ts"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".npmrc"
      - "Dockerfile"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "scripts/audit-dependencies.ts"
      - "src/lib/dependency-audit.test.ts"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Validate locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit locked dependencies
        run: bun scripts/audit-dependencies.ts

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-audit-json
          path: |
            bun-audit.json
            bun-audit-raw.json
            bun-audit-verdict.json
          if-no-files-found: error
